# hello-v2 — второй backend для маршрута /v2 и traffic splitting (/canary).
# Та же база, другие имя и метки: ответ "Hello World! from hello-v2-…".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

nameSuffix: -v2

labels:
  - pairs:
      app.kubernetes.io/name: hello-v2
    includeSelectors: true

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1version
        value: v2
  # Kustomize не знает селекторов CRD PodMonitor — меняем явно
  - target:
      kind: PodMonitor
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: hello-v2
