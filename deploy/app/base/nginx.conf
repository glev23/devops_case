# nginx для демонстрационного приложения.
# Образ nginx-unprivileged: работает от uid 101, rootfs только для чтения,
# все временные файлы — в /tmp (emptyDir).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    # Access-лог в JSON: Fluentd разбирает поля без регулярных выражений
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$http_x_request_id",'
        '"traceparent":"$http_traceparent",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"host":"$host",'
        '"user_agent":"$http_user_agent",'
        '"pod":"$hostname"'
    '}';

    access_log /dev/stdout json;

    server {
        listen 8080;
        default_type text/plain;

        location = / {
            return 200 "Hello World! from $hostname\n";
        }

        # Демонстрация ошибок для метрик кодов ответа (MON-002)
        location = /error {
            return 500 "Internal Server Error (demo)\n";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404 "Not Found\n";
        }
    }

    # Метрики nginx для экспортера (MON-001); наружу не публикуется
    server {
        listen 8081;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
