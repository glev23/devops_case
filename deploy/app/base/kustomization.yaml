# Базовое приложение hello (v1). Вариант v2 собирается из этой же базы в ../v2.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - podmonitor.yaml

# Хэш в имени ConfigMap: изменение nginx.conf само перезапускает поды
configMapGenerator:
  - name: hello-nginx
    files:
      - nginx.conf
