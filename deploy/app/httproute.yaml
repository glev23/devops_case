# Значения по умолчанию (group, kind, weight) указаны явно: иначе сервер
# дописывает их в списки, и `kubectl apply` каждый раз сообщает configured.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hello
          port: 80
          weight: 1
