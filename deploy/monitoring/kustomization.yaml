apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-case
    includeSelectors: false

resources:
  - httproutes.yaml       # Grafana и Prometheus через Gateway по hostname
  - envoy-monitors.yaml   # метрики Envoy Gateway (прокси и контроллер)
  - alerts.yaml           # алерты и recording rules

# Дашборд Grafana: sidecar подхватывает ConfigMap с меткой grafana_dashboard=1
configMapGenerator:
  - name: dashboard-gateway-app
    files:
      - dashboards/gateway-app.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
