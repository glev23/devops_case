# Маршрутизация по hostname через тот же Gateway, что и приложение:
#   grafana.devops.test    → Grafana
#   prometheus.devops.test → Prometheus UI (targets, PromQL)
# Остальные hostname попадают на маршрут приложения (demo/hello без hostnames).
# Подключены ко всем listener: HTTP :30080 и HTTPS :30443.
# Значения по умолчанию (group, kind, weight) указаны явно — иначе
# `kubectl apply` на CRD каждый раз сообщает configured.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - grafana.devops.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kps-grafana
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - prometheus.devops.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kps-prometheus
          port: 9090
          weight: 1
