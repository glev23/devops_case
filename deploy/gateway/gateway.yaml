apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Маршруты принимаются только из namespace, которым это явно разрешено
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
