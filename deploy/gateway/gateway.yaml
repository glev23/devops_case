apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Маршруты принимаются только из namespace, которым это явно разрешено
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    # HTTPS: TLS терминируется на Envoy, сертификат *.devops.test от cert-manager
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: devops-test-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
