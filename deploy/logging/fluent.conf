# Fluentd: логи всех контейнеров узла → Loki.
# Файлы /var/log/containers/<pod>_<namespace>_<container>-<id>.log пишет
# containerd в формате CRI: "<время> <stdout|stderr> <F|P> <сообщение>".

<system>
  log_level info
</system>

<source>
  @type tail
  @id containers
  path /var/log/containers/*.log
  # Собственные логи Fluentd не собираем, чтобы не зациклиться
  exclude_path ["/var/log/containers/fluentd-*_logging_*.log"]
  pos_file /var/log/fluentd/containers.pos
  tag kube.*
  read_from_head true
  refresh_interval 5
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>

# namespace / pod / container — из имени файла (тег kube.var.log.containers.<файл>.log)
<filter kube.**>
  @type record_transformer
  enable_ruby true
  <record>
    namespace ${tag_parts[4].split('_')[1]}
    pod ${tag_parts[4].split('_')[0]}
    container ${tag_parts[4].split('_')[2].to_s.sub(/-[0-9a-f]{64}$/, '')}
  </record>
  remove_keys logtag
</filter>

# Access-лог nginx — JSON: разбираем в поля (uri, status, request_id, …)
<filter kube.var.log.containers.*_demo_nginx-*.log>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%:z
    keep_time_key true
  </parse>
</filter>

<match kube.**>
  @type loki
  @id loki
  url "http://loki.logging:3100"
  extra_labels {"cluster":"devops-case","collector":"fluentd"}
  line_format json
  <label>
    namespace
    pod
    container
    stream
  </label>
  remove_keys namespace,pod,container,stream
  # Буфер на диске узла: при недоступности Loki логи не теряются
  <buffer>
    @type file
    path /var/log/fluentd/buffer/loki
    flush_interval 5s
    flush_at_shutdown true
    chunk_limit_size 1m
    total_limit_size 256m
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>
