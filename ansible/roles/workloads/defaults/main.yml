---
# Каталоги deploy/*, которые доставляются в кластер, — в порядке зависимостей:
# Gateway и TLS → маршруты/мониторы/алерты → сборщик логов → приложение.
workloads_items:
  - name: gateway
    path: deploy/gateway
    namespace: gateway
  - name: monitoring
    path: deploy/monitoring
    namespace: monitoring
  - name: logging
    path: deploy/logging
    namespace: logging
  - name: demo
    path: deploy/app
    namespace: demo
    # Демонстрационные релизы (scripts/release.sh) запускаются командой, а не
    # коммитом: self-heal откатил бы их за секунды. Синхронизация по новым
    # коммитам остаётся (automated sync), ручные изменения видны как OutOfSync.
    self_heal: false
    # Поля, которые во время работы меняет Argo Rollouts, не считаются
    # расхождением с Git (при синхронизации нового коммита манифест
    # применяется целиком — RespectIgnoreDifferences не используется: он
    # подставляет живой список backendRefs и не даёт добавить новый backend)
    ignore_differences:
      # веса stable/canary в правиле "/"
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: hello
        jqPathExpressions:
          - .spec.rules[2].backendRefs[].weight
      # хэш шаблона пода, который Rollouts добавляет в селекторы
      - group: ""
        kind: Service
        name: hello
        jsonPointers:
          - /spec/selector
      - group: ""
        kind: Service
        name: hello-canary
        jsonPointers:
          - /spec/selector
