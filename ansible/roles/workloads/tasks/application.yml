---
# Одно приложение Argo CD: создать Application и дождаться синхронизации с Git.

- name: Create Argo CD Application {{ item.name }}
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'application.yaml.j2') | from_yaml }}"

# Если self-heal выключен (demo), Argo CD не синхронизирует ручные изменения
# сам — deploy.sh приводит такое приложение к Git явно. В штатном состоянии
# (Synced) ничего не запускается — повторный запуск даёт changed=0.
- name: Read sync state of Application {{ item.name }}
  ansible.builtin.command: >
    kubectl -n argocd get application/{{ item.name }}
    -o jsonpath={.status.sync.status}/{.status.operationState.phase}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: workloads_app_state
  until: workloads_app_state.stdout.split('/')[0] in ['Synced', 'OutOfSync']
  retries: 30
  delay: 5
  changed_when: false

- name: Request sync of Application {{ item.name }}
  ansible.builtin.command: >
    kubectl -n argocd patch application/{{ item.name }} --type merge
    -p '{"operation":{"initiatedBy":{"username":"deploy.sh"},"sync":{"revision":"{{ gitops_revision }}"}}}'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  when:
    - workloads_app_state.stdout.split('/')[0] == 'OutOfSync'
    - workloads_app_state.stdout.split('/')[1] | default('') != 'Running'
  changed_when: true

- name: Wait for Git sync of Application {{ item.name }}
  ansible.builtin.command: >
    kubectl -n argocd wait application/{{ item.name }}
    --for=jsonpath='{.status.sync.status}'=Synced --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Wait for health of Application {{ item.name }}
  ansible.builtin.command: >
    kubectl -n argocd wait application/{{ item.name }}
    --for=jsonpath='{.status.health.status}'=Healthy --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
