---
# Loki (хранилище логов). Fluentd (deploy/logging) доставляет роль workloads.

- name: Install Loki
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    release_name: loki
    release_namespace: logging
    create_namespace: true
    chart_repo_url: https://grafana.github.io/helm-charts
    chart_ref: loki
    chart_version: "{{ loki_chart_version }}"
    values_files:
      - "{{ repo_root }}/helm-values/loki.yaml"
    wait: true
    wait_timeout: 10m
  register: logging_helm
  until: logging_helm is succeeded
  retries: 2
  delay: 20
