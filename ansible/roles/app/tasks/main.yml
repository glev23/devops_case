---
# Демонстрационное приложение: Kustomize из deploy/app.

- name: Apply demo application
  ansible.builtin.include_role:
    name: kustomize
  vars:
    kustomize_dir: deploy/app

- name: Wait for demo application rollout
  ansible.builtin.command: kubectl -n demo rollout status deployment/{{ item }} --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
  loop: [hello, hello-v2]
