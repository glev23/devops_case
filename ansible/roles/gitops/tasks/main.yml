---
# Argo CD: GitOps-доставка манифестов deploy/* из Git (роль workloads создаёт Application).

- name: Create argocd namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
        labels:
          # Разрешает маршруту UI Argo CD подключаться к Gateway main
          gateway-access: "true"

- name: Install Argo CD
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    release_name: argocd
    release_namespace: argocd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_ref: argo-cd
    chart_version: "{{ argocd_chart_version }}"
    values_files:
      - "{{ repo_root }}/helm-values/argo-cd.yaml"
    wait: true
    wait_timeout: 10m

- name: Apply Argo CD UI route
  ansible.builtin.include_role:
    name: kustomize
  vars:
    kustomize_dir: deploy/argocd
