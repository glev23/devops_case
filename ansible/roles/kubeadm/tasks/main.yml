---
# kubelet/kubeadm/kubectl закреплённой версии и kubeadm init (только если кластера нет).

# deb822: один файл kubernetes.sources с репозиторием и ключом (модуль сам
# скачивает ключ по URL); смена версии перезаписывает файл, а не дописывает.
- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_pkg_version }}"
      - "kubeadm={{ k8s_pkg_version }}"
      - "kubectl={{ k8s_pkg_version }}"
    state: present
    update_cache: true
    # Закреплённая версия — источник правды: более новый kubectl (например,
    # предустановленный) понижается до версии кластера
    allow_downgrade: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Render kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Initialize control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: "{{ kubeconfig }}"

- name: Get kube user home
  ansible.builtin.getent:
    database: passwd
    key: "{{ kube_user }}"

- name: Create .kube directories
  ansible.builtin.file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.owner }}"
    mode: "0700"
  loop:
    - { home: /root, owner: root }
    - { home: "{{ ansible_facts.getent_passwd[kube_user][4] }}", owner: "{{ kube_user }}" }

- name: Install kubeconfig for root and kube user
  ansible.builtin.copy:
    src: "{{ kubeconfig }}"
    dest: "{{ item.home }}/.kube/config"
    remote_src: true
    owner: "{{ item.owner }}"
    mode: "0600"
  loop:
    - { home: /root, owner: root }
    - { home: "{{ ansible_facts.getent_passwd[kube_user][4] }}", owner: "{{ kube_user }}" }

- name: Wait for API server
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ kubeconfig }}"
  register: kubeadm_nodes
  until: kubeadm_nodes.resources | length > 0
  retries: 30
  delay: 5
