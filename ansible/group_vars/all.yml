---
# Все версии и параметры решения — только здесь.
# Совместимость сверена 30.09.2026 (documentation/architecture.md, §3).

# Kubernetes (kubeadm)
k8s_minor: "1.36"
k8s_version: "1.36.5"
k8s_pkg_version: "{{ k8s_version }}-1.1"

pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# Стабильный адрес узла на dummy-интерфейсе. kubeadm вшивает IP узла в
# сертификаты и конфиги, а DHCP (облачные VM, Hyper-V, Multipass) может
# сменить адрес после перезагрузки — кластер бы сломался. API, kubelet и
# Calico привязаны к этому адресу; снаружи сервисы доступны по любому IP узла
# (NodePort слушает на всех адресах). Пустая строка — использовать основной IPv4.
node_stable_ip: "10.200.0.10"
node_ip: "{{ node_stable_ip if node_stable_ip | length > 0 else ansible_default_ipv4.address }}"

# CNI
calico_version: "v3.32.2"

# Gateway API: Envoy Gateway (чарт несёт CRD Gateway API v1.6.1)
envoy_gateway_version: "v1.9.2"

# TLS для Gateway (поддерживает Kubernetes 1.33–1.36)
cert_manager_version: "v1.21.2"

# Мониторинг: Prometheus Operator v0.94.1, Prometheus, Alertmanager, Grafana
kube_prometheus_stack_version: "91.8.2"

# Логирование: Loki 3.6 (чарт grafana/loki), Fluentd — образ в deploy/logging
loki_chart_version: "7.3.0"

# GitOps (CD-001): Argo CD синхронизирует deploy/* с Git.
# gitops_enabled: false — манифесты применяются из локальной копии (kubectl),
# например без доступа к GitHub. В CI gitops_revision = SHA проверяемого коммита.
gitops_enabled: true
gitops_repo_url: https://github.com/glev23/devops_case.git
gitops_revision: main
argocd_chart_version: "10.9.6"   # Argo CD v3.5.3

# Трейсинг (TRACE-001): Tempo 3.1 (чарт перенесён в grafana-community)
tempo_chart_version: "3.1.0"

# Прогрессивная доставка (ROLLOUT-001): Argo Rollouts + плагин Gateway API v0.17.0
argo_rollouts_chart_version: "2.43.2"
argo_rollouts_version: "v1.10.0"
argo_rollouts_cli_sha256: 57a464e80c3e716076c9760e1d15ff06b853e3bcab3e22e30f4dba8a3e9f29b2

# Helm (ветка 3: модули kubernetes.core рассчитаны на Helm 3)
helm_version: "v3.22.0"

# Пользователь, которому кладётся kubeconfig (тот, кто вызвал sudo)
kube_user: "{{ lookup('ansible.builtin.env', 'SUDO_USER') | default('root', true) }}"
kubeconfig: /etc/kubernetes/admin.conf

# Корень репозитория (манифесты Kustomize лежат в deploy/)
repo_root: "{{ playbook_dir | dirname }}"
