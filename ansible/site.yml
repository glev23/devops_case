---
- name: Kubernetes node and cluster
  hosts: k8s
  become: true
  roles:
    - node
    - kubeadm
    - cni
    - helm

- name: Platform
  hosts: k8s
  become: true
  roles:
    - certmanager
    - gateway
    - monitoring
    - logging

- name: Workloads
  hosts: k8s
  become: true
  roles:
    - app
