# Узел для установки.
#
# По умолчанию — тот, где запущен sudo ./deploy.sh (локально, без SSH).
#
# Установка на удалённый узел Ubuntu 24.04 с управляющей машины (нужны Ansible
# и коллекции kubernetes.core, community.general, ansible.posix; на узле —
# SSH-доступ и sudo без пароля): замените строку localhost, например
#   node1 ansible_host=192.0.2.10 ansible_user=ubuntu
# и запустите из каталога ansible/:
#   ansible-playbook site.yml
# Манифесты, values и скрипты скопируются на узел в /opt/devops-case;
# проверки — на узле: cd /opt/devops-case && make verify
[k8s]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
