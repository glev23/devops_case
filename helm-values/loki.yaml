# Loki в монолитном режиме (single binary) для одного узла.
# Хранение — файловая система на emptyDir: в кластере kubeadm нет
# StorageClass (ограничения — architecture.md §12).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    # Fluentd отправляет пачками: разрешаем запись с небольшим опозданием
    reject_old_samples: true
    reject_old_samples_max_age: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # Без PVC чарт ничего не монтирует в /var/loki, а rootfs пода read-only:
  # данные (chunks, индекс, компактор) — в emptyDir
  extraVolumes:
    - name: data
      emptyDir:
        sizeLimit: 5Gi
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi

# Режим SimpleScalable выключен целиком
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Кэши memcached и вспомогательные компоненты на одном узле не нужны
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Метрики самого Loki — в Prometheus
monitoring:
  serviceMonitor:
    enabled: true
